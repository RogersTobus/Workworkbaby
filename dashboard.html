<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>통합 업무 홈</title>
  <style>
    :root{--ink:#15223b;--muted:#73809a;--blue:#3860df;--navy:#17243d;--green:#2e9c6c;--amber:#d79325;--red:#d45762}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:radial-gradient(circle at 8% 4%,#d9e5ff 0,transparent 32%),radial-gradient(circle at 92% 8%,#e8e1ff 0,transparent 30%),linear-gradient(135deg,#f8faff,#edf3fb)}
    main{max-width:1480px;margin:auto;padding:34px 26px 70px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font-size:13px;font-weight:950;letter-spacing:.14em;color:var(--blue)}h1{margin:9px 0 0;font-size:42px;line-height:1}.header-right{display:flex;align-items:center;gap:12px}.today{font-size:14px;color:var(--muted);font-weight:850}.refresh{border:0;border-radius:12px;background:#fff;color:var(--blue);padding:11px 16px;font:inherit;font-weight:950;box-shadow:0 9px 24px rgba(49,78,148,.12);cursor:pointer}
    .nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;padding:7px;border:1px solid rgba(255,255,255,.76);border-radius:18px;background:rgba(255,255,255,.53);box-shadow:0 15px 38px rgba(49,68,108,.10);backdrop-filter:blur(22px)}.nav a{padding:11px 14px;border-radius:12px;color:#63708a;text-decoration:none;font-size:14px;font-weight:850}.nav a.active{background:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(23,36,61,.23)}
    .glass{border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.68);box-shadow:0 22px 52px rgba(42,58,94,.10);backdrop-filter:blur(24px)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.kpi{border-radius:20px;padding:19px 20px;text-decoration:none;color:inherit;transition:.16s}.kpi:hover,.card-link:hover{transform:translateY(-2px)}.kpi-label{font-size:13px;color:var(--muted);font-weight:900}.kpi-value{display:flex;align-items:flex-end;gap:6px;margin-top:8px}.kpi-value strong{font-size:34px;line-height:1}.kpi-value span{font-size:13px;color:var(--muted);padding-bottom:3px}.kpi-note{margin-top:10px;font-size:12px;color:#7c88a0}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.8fr);gap:17px}.column{display:grid;gap:17px;align-content:start}.card{border-radius:24px;padding:22px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.card-head h2{font-size:19px;margin:0}.card-head a{color:var(--blue);font-size:12px;font-weight:900;text-decoration:none}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;background:rgba(244,247,253,.82);border:1px solid rgba(200,211,234,.5)}.priority{width:8px;height:8px;border-radius:50%;background:#b7c2d8;flex:0 0 auto}.priority[data-level="3"]{background:var(--red)}.priority[data-level="2"]{background:var(--amber)}.priority[data-level="1"]{background:var(--green)}.item-main{min-width:0;flex:1}.item-title{font-size:14px;font-weight:900;line-height:1.35}.item-sub{margin-top:4px;font-size:11px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#edf1fa;color:#63708a;font-size:10px;font-weight:950;white-space:nowrap}.badge.good{background:#e6f6ef;color:#27845e}.badge.warn{background:#fff2d9;color:#ad6e00}.badge.error{background:#ffe8eb;color:#bd3d4b}
    .event-grid,.dm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.event{padding:13px;border-radius:15px;background:#fff6dd;border:1px solid #f3d483}.event.popup{background:#eaf8df;border-color:#aada8f}.event-name{font-size:13px;font-weight:950}.event-date{margin-top:6px;color:#7e6b3f;font-size:11px}.dm-card{display:block;color:inherit;text-decoration:none;padding:15px;border-radius:16px;background:rgba(244,247,253,.84);border:1px solid rgba(200,211,234,.55);transition:.16s}.dm-top,.dm-bottom{display:flex;justify-content:space-between;gap:10px}.dm-name,.dm-number{font-weight:950}.dm-bottom{font-size:11px;color:var(--muted)}.bar{height:7px;border-radius:99px;background:#dfe6f4;overflow:hidden;margin:12px 0 8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#3860df,#7d73eb);border-radius:inherit}
    .task-controls{display:flex;align-items:center;gap:8px}.priority-badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:6px 8px;border-radius:9px;background:#fff4d6;color:#e39a00;font-size:12px;font-weight:950;letter-spacing:-1px;border:1px solid #f1d793}.status-select{min-width:105px;border:1px solid #cbd6ec;border-radius:9px;background:#fff;color:#4d5e7f;padding:7px 28px 7px 9px;font:inherit;font-size:11px;font-weight:900;cursor:pointer}.status-select:disabled{opacity:.6;cursor:wait}.routine-check{appearance:none;width:20px;height:20px;flex:0 0 20px;margin:0;border:2px solid #9bacd4;border-radius:6px;background:#fff;display:grid;place-items:center;cursor:pointer}.routine-check:checked{border-color:var(--blue);background:var(--blue)}.routine-check:checked::after{content:"✓";color:#fff;font-size:13px;font-weight:950;line-height:1}.routine-check:disabled{opacity:.55;cursor:wait}.routine-item.completed .item-title{text-decoration:line-through;color:#939bad}.system-list{display:grid;gap:8px}.system{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:rgba(244,247,253,.82);text-decoration:none;color:inherit;transition:.16s}.light{width:9px;height:9px;border-radius:50%;background:#aeb8ca}.light.good{background:var(--green)}.light.warn{background:var(--amber)}.light.error{background:var(--red)}.system-main{flex:1;min-width:0}.system-title{font-size:13px;font-weight:950}.system-message{margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:90px 20px;text-align:center;color:var(--muted);font-weight:900}.toast{position:fixed;right:20px;bottom:20px;max-width:390px;padding:13px 16px;border-radius:13px;background:var(--navy);color:#fff;font-size:13px;font-weight:850;box-shadow:0 15px 35px rgba(23,36,61,.3);opacity:0;transform:translateY(15px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){main{padding:22px 14px 50px}header{align-items:flex-start;flex-direction:column}h1{font-size:34px}.header-right{width:100%;justify-content:space-between}.kpis,.event-grid,.dm-grid{grid-template-columns:1fr}.card{padding:18px}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">TOBUS · WORKSPACE OVERVIEW</div><h1>통합 업무 홈</h1></div><div class="header-right"><span id="today" class="today"></span><button id="refresh" class="refresh">새로고침</button></div></header>
  <nav class="nav" aria-label="업무 메뉴"><a class="active" href="/dashboard">업무 홈</a><a href="/brand-connecting">브랜드 커넥팅</a><a href="/">Instagram DM</a><a href="/prices">네이버 가격 최신화</a><a href="/simulation">시뮬레이션</a><a href="/calendar">업무 캘린더</a><a href="/work-log">업무기록</a><a href="/meetings">회의록</a><a href="/memos">메모</a><a href="/sales-email">영업메일</a><a href="/cs-tracker">CS 추적기</a></nav>
  <div id="content" class="loading">오늘 업무 현황을 불러오는 중입니다.</div>
</main>
<div id="toast" class="toast"></div>
<script>
  const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const empty=text=>`<div class="empty">${esc(text)}</div>`;function toast(text){const el=$("toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400)}
  function stateTone(state){state=String(state||"").toLowerCase();if(["complete","completed","success","done","idle","ready"].some(v=>state.includes(v)))return"good";if(["error","fail","expired","revoked","login"].some(v=>state.includes(v)))return"error";if(["running","progress","sync","working"].some(v=>state.includes(v)))return"warn";return""}
  const statusOptions=[['todo','시작 전'],['doing','진행 중'],['review','컨펌 대기'],['done','완료']];
  function renderTasks(data){const items=data.tasks.items||[];return items.length?`<div class="list">${items.map(item=>`<div class="item"><span class="priority" data-level="${Number(item.priority||0)}"></span><div class="item-main"><div class="item-title">${esc(item.text)}</div></div><div class="task-controls"><span class="priority-badge" aria-label="우선순위 별 ${Number(item.priority||0)}개">${"★".repeat(Number(item.priority||0))}</span><select class="status-select" data-task-status data-id="${esc(item.id)}" data-source-id="${esc(item.source_id||'')}" data-date="${esc(item.date||data.date)}" aria-label="업무 상태: ${esc(item.text)}">${statusOptions.map(([key,label])=>`<option value="${key}" ${key===(item.status||'todo')?'selected':''}>${label}</option>`).join('')}</select></div></div>`).join("")}</div>`:empty("오늘 남은 업무가 없습니다.")}
  function renderRoutines(data){const items=data.routines.items||[];return items.length?`<div class="list">${items.map(item=>`<label class="item routine-item ${item.completed?'completed':''}"><input class="routine-check" type="checkbox" data-routine-toggle data-id="${esc(item.id)}" ${item.completed?'checked':''}><div class="item-main"><div class="item-title">${esc(item.text)}</div><div class="item-sub">${esc(item.recurrence_label||"")} · 체크 즉시 캘린더 반영</div></div></label>`).join("")}</div>`:empty("등록된 루틴이 없습니다.")}
  function renderEvents(data){const items=data.events||[];return items.length?`<div class="event-grid">${items.map(item=>`<div class="event ${item.type==="popup"?"popup":""}"><div class="event-name">${esc(item.text)}</div><div class="event-date">${esc(item.label)} · ${esc(item.type_label)}</div></div>`).join("")}</div>`:empty("오늘 진행 중인 행사가 없습니다.")}
  function renderCs(data){const items=data.cs.items||[];return items.length?`<div class="list">${items.map(item=>`<div class="item"><div class="item-main"><div class="item-title">${esc(item.brand)} · ${esc(item.customer_name)}</div><div class="item-sub">${esc(item.partner)} · ${esc(item.order_number)} · ${esc(item.received_date||"")}</div></div><span class="badge ${item.status==="보류"?"warn":""}">${esc(item.status)}</span></div>`).join("")}</div>`:empty("미처리 CS가 없습니다.")}
  function renderDm(data){return `<div class="dm-grid">${(data.dm||[]).map(item=>{const rate=item.goal?Math.min(100,item.weekly_sent/item.goal*100):0;return `<a class="dm-card card-link" href="/?brand=${esc(item.brand_key)}"><div class="dm-top"><span class="dm-name">${esc(item.brand_name)}</span><span class="dm-number">${item.weekly_sent} / ${item.goal}명</span></div><div class="bar"><span style="width:${rate}%"></span></div><div class="dm-bottom"><span>남은 목표 ${item.remaining}명</span><span>대기 ${item.pending}명</span></div></a>`}).join("")}</div>`}
  function renderSystems(data){const s=data.systems||{},p=s.prices||{},c=s.calendar||{},a=s.automations||{};const rows=[{title:"네이버 가격",href:"/prices",status:p.status,message:p.message||"상태 확인 중"},{title:"행사 캘린더",href:"/calendar",status:c.status,message:c.message||"상태 확인 중"},{title:"크리에이터 명단 수집",href:"/brand-connecting",status:a.crawl?.status,message:a.crawl?.message},{title:"크리에이터 찜",href:"/brand-connecting",status:a.favorite?.status,message:a.favorite?.message},{title:"제안 결과 확인",href:"/brand-connecting",status:a.proposal?.status,message:a.proposal?.message}];return `<div class="system-list">${rows.map(row=>`<a class="system card-link" href="${row.href}"><span class="light ${stateTone(row.status)}"></span><div class="system-main"><div class="system-title">${esc(row.title)}</div><div class="system-message">${esc(row.message||"대기 중")}</div></div><span class="badge ${stateTone(row.status)}">${esc(row.status||"idle")}</span></a>`).join("")}</div>`}
  function render(data){const taskTotal=data.tasks.remaining+data.tasks.completed,routineTotal=data.routines.remaining+data.routines.completed;$("today").textContent=new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(new Date(`${data.date}T00:00:00`));$("content").className="";$("content").innerHTML=`<section class="kpis"><a class="glass kpi" href="/calendar"><div class="kpi-label">오늘 남은 업무</div><div class="kpi-value"><strong>${data.tasks.remaining}</strong><span>/ ${taskTotal}건</span></div><div class="kpi-note">완료 ${data.tasks.completed}건</div></a><a class="glass kpi" href="/calendar"><div class="kpi-label">미완료 루틴</div><div class="kpi-value"><strong>${data.routines.remaining}</strong><span>/ ${routineTotal}건</span></div><div class="kpi-note">다음 주기에 체크가 초기화됩니다.</div></a><a class="glass kpi" href="/cs-tracker"><div class="kpi-label">미처리 CS</div><div class="kpi-value"><strong>${data.cs.open}</strong><span>/ ${data.cs.total}건</span></div><div class="kpi-note">완료 전 CS만 집계합니다.</div></a><a class="glass kpi" href="/calendar"><div class="kpi-label">오늘 진행 행사</div><div class="kpi-value"><strong>${data.events.length}</strong><span>건</span></div><div class="kpi-note">오늘이 행사 기간에 포함된 건입니다.</div></a></section><div class="layout"><div class="column"><section class="glass card"><div class="card-head"><h2>오늘 업무</h2><a href="/calendar">캘린더 열기 →</a></div>${renderTasks(data)}</section><section class="glass card"><div class="card-head"><h2>진행 중 행사</h2><a href="/calendar">전체 보기 →</a></div>${renderEvents(data)}</section><section class="glass card"><div class="card-head"><h2>이번 주 DM 목표</h2><a href="/">DM 열기 →</a></div>${renderDm(data)}</section></div><div class="column"><section class="glass card"><div class="card-head"><h2>데일리 루틴</h2><a href="/calendar">루틴 관리 →</a></div>${renderRoutines(data)}</section><section class="glass card"><div class="card-head"><h2>미처리 CS</h2><a href="/cs-tracker">CS 추적기 →</a></div>${renderCs(data)}</section><section class="glass card"><div class="card-head"><h2>자동화·연결 상태</h2><a href="/brand-connecting">확인하기 →</a></div>${renderSystems(data)}</section></div></div>`}
  async function requestJSON(url,options={}){const response=await fetch(url,options),data=await response.json();if(!response.ok)throw new Error(data.error||'변경사항을 저장하지 못했습니다.');return data}
  async function updateTaskStatus(select){const previous=select.dataset.previous||select.querySelector('option[selected]')?.value||'todo';select.disabled=true;try{await requestJSON('/api/calendar/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',id:select.dataset.id,source_id:select.dataset.sourceId||'',date:select.dataset.date,status:select.value})});toast('업무 상태를 변경했습니다.');await load()}catch(error){select.value=previous;select.disabled=false;toast(error.message)}}
  async function toggleRoutine(check){const previous=!check.checked;check.disabled=true;try{await requestJSON('/api/calendar/routine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'toggle',id:check.dataset.id,completed:check.checked})});toast(check.checked?'루틴을 완료했습니다.':'루틴 완료를 취소했습니다.');await load()}catch(error){check.checked=previous;check.disabled=false;toast(error.message)}}
  async function load(){const button=$("refresh");button.disabled=true;try{const response=await fetch("/api/home-dashboard",{cache:"no-store"}),data=await response.json();if(!response.ok)throw new Error(data.error||"대시보드를 불러오지 못했습니다.");render(data)}catch(error){$("content").className="glass card empty";$("content").textContent=error.message;toast(error.message)}finally{button.disabled=false}}
  $("content").addEventListener('change',event=>{const target=event.target;if(target.matches('[data-task-status]'))updateTaskStatus(target);if(target.matches('[data-routine-toggle]'))toggleRoutine(target)});
  $("refresh").addEventListener("click",()=>{load();toast("업무 현황을 다시 불러옵니다.")});load();setInterval(load,60000);
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리뷰 관리</title>
  <style>
    :root{--ink:#17233c;--muted:#71809b;--line:rgba(135,157,199,.28);--blue:#3e65de;--navy:#17243d;--danger:#c84e5d}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;min-height:100vh}main{max-width:1480px;margin:auto;padding:34px 26px 74px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px}.eyebrow{font-size:13px;font-weight:950;letter-spacing:.14em;color:var(--blue)}h1{font-size:42px;line-height:1;margin:9px 0 0}.desc{color:var(--muted);font-size:14px;text-align:right}
    .nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.nav a{padding:11px 14px;border-radius:12px;color:#63708a;text-decoration:none;font-size:14px;font-weight:850}.nav a.active{background:var(--navy);color:#fff}
    .brand-tabs{position:sticky;top:10px;z-index:10;display:flex;gap:8px;width:min(420px,100%);padding:6px;margin:0 0 18px;border:1px solid rgba(255,255,255,.84);border-radius:17px;background:rgba(246,249,255,.82);box-shadow:0 12px 30px rgba(49,68,108,.11);backdrop-filter:blur(24px)}.brand-tab{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:950;color:#72809a;background:transparent;cursor:pointer}.brand-tab.active{background:linear-gradient(135deg,#3e68e7,#6b74e8);color:#fff;box-shadow:0 9px 20px rgba(54,94,220,.22)}
    .toolbar{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:10px;align-items:center;margin-bottom:15px;padding:14px;border:1px solid rgba(255,255,255,.82);border-radius:20px;background:rgba(255,255,255,.62);box-shadow:0 18px 38px rgba(42,58,94,.09);backdrop-filter:blur(22px)}input,textarea{width:100%;border:1px solid #cad6ea;border-radius:13px;background:rgba(252,253,255,.86);color:var(--ink);font:inherit;outline:none}input{height:46px;padding:0 14px}textarea{height:72px;min-height:72px;padding:11px 13px;line-height:1.55;resize:none;overflow-y:scroll;scrollbar-gutter:stable}textarea::-webkit-scrollbar{width:9px}textarea::-webkit-scrollbar-track{background:#eef2f8;border-radius:999px}textarea::-webkit-scrollbar-thumb{background:#9ba9c1;border:2px solid #eef2f8;border-radius:999px}input:focus,textarea:focus{border-color:#7695ee;box-shadow:0 0 0 3px rgba(54,95,224,.11)}
    button{border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#3e68e7,#6b74e8);color:#fff}.secondary{background:#e9eef8;color:#59667e}.danger{background:#fff0f1;color:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}
    .summary{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 4px 13px}.summary strong{font-size:20px}.summary span{color:var(--muted);font-size:13px}.count{color:var(--blue);font-weight:950}
    .template-list{display:grid;gap:9px}.template-card{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;padding:13px 15px;border:1px solid rgba(255,255,255,.84);border-radius:18px;background:rgba(255,255,255,.69);box-shadow:0 12px 28px rgba(42,58,94,.09);backdrop-filter:blur(24px)}.template-main{min-width:0}.template-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:5px}.template-number{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#e9efff;color:var(--blue);font-weight:950}.title-wrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.title-input{height:32px;font-size:16px;font-weight:950;border-color:transparent;background:transparent;padding:0 4px}.title-input:focus{background:#fff;border-color:#7695ee}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px 36px}.chip{padding:3px 7px;border-radius:999px;background:#edf1fa;color:#65738c;font-size:10px;font-weight:850}.message{margin-left:36px;width:calc(100% - 36px);font-size:13px}.scroll-note{display:block;margin:3px 2px 0 36px;color:#8b96a9;font-size:10px;text-align:right}.card-actions{display:flex;flex-direction:column;gap:6px}.card-actions button{padding:9px 10px}.copy-button{min-height:46px;background:var(--navy);color:#fff;font-size:14px}.save-button{background:#e8eeff;color:#315bd4}.delete-button{margin-top:auto;background:transparent;color:#a96a73;font-size:11px}.empty{padding:60px 20px;text-align:center;border:1px dashed #bac8df;border-radius:20px;color:#7d8aa1;background:rgba(255,255,255,.48)}
    .toast{position:fixed;right:24px;bottom:24px;z-index:30;padding:13px 17px;border-radius:13px;background:#17243d;color:#fff;font-weight:850;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:760px){main{padding:24px 14px 55px}header{align-items:flex-start;flex-direction:column}.desc{text-align:left}h1{font-size:35px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.template-card{grid-template-columns:1fr;padding:13px}.card-actions{display:grid;grid-template-columns:1fr 1fr}.delete-button{grid-column:1/-1}.chips,.message{margin-left:0;width:100%}.scroll-note{margin-left:0}.title-input{font-size:15px}.summary{align-items:flex-start;flex-direction:column;gap:4px}}
  </style>
  <link rel="stylesheet" href="/glass-theme.css">
</head>
<body class="page-reviews">
<main>
  <header><div><div class="eyebrow">TOBUS · REVIEW RESPONSE</div><h1>리뷰 관리</h1></div><div class="desc">위에서 아래로 훑고, 같은 위치의 복사 버튼만 누르면 됩니다</div></header>
  <nav class="nav" aria-label="업무 메뉴">
    <a href="/dashboard">업무 홈</a><a href="/brand-connecting">브랜드 커넥팅</a><a href="/">Instagram DM</a><a href="/prices">네이버 가격 최신화</a><a href="/simulation">시뮬레이션</a><a href="/calendar">업무 캘린더</a><a href="/work-log">업무기록</a><a href="/meetings">회의록</a><a href="/memos">메모</a><a href="/sales-email">영업메일</a><a href="/cs-tracker">CS 추적기</a><a class="active" href="/reviews">리뷰 관리</a>
  </nav>
  <div class="brand-tabs" role="tablist" aria-label="리뷰 브랜드">
    <button class="brand-tab active" data-brand="alp" type="button">ALP</button>
    <button class="brand-tab" data-brand="gaia" type="button">GAEA</button>
  </div>
  <section class="toolbar" aria-label="리뷰 템플릿 도구">
    <input id="search" type="search" placeholder="유형이나 리뷰 표현을 검색하세요">
    <button id="newTemplate" class="primary" type="button">+ 새 유형</button>
    <button id="resetBrand" class="secondary" type="button">기본 문구 복원</button>
  </section>
  <div class="summary"><strong id="brandTitle">ALP 응대 문구</strong><span>자료 순서대로 <span id="templateCount" class="count">0개</span> · 문구는 바로 수정하고 카드별로 저장할 수 있습니다.</span></div>
  <section id="templateList" class="template-list" aria-live="polite"></section>
</main>
<div id="toast" class="toast" role="status"></div>
<script>
  let brands={alp:[],gaia:[]},currentBrand="alp";
  const $=id=>document.getElementById(id),esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  function toast(message){const node=$("toast");node.textContent=message;node.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove("show"),2200)}
  async function request(url,options){const response=await fetch(url,options),data=await response.json();if(!response.ok)throw new Error(data.error||"처리하지 못했습니다.");return data}
  function items(){return brands[currentBrand]||[]}
  function filtered(){const keyword=$("search").value.trim().toLocaleLowerCase("ko");return keyword?items().filter(item=>`${item.title} ${(item.keywords||[]).join(" ")} ${item.message}`.toLocaleLowerCase("ko").includes(keyword)):items()}
  async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch(_error){const helper=document.createElement("textarea");helper.value=text;helper.style.position="fixed";helper.style.opacity="0";document.body.append(helper);helper.select();document.execCommand("copy");helper.remove()}const before=button.textContent;button.textContent="복사 완료 ✓";setTimeout(()=>button.textContent=before,1200);toast("응대 문구를 복사했습니다.")}
  function cardValues(card){return{id:card.dataset.id,title:card.querySelector(".title-input").value.trim(),keywords:card._keywords||[],message:card.querySelector(".message").value}}
  async function saveCard(card){const button=card.querySelector(".save-button"),values=cardValues(card);button.disabled=true;try{const data=await request("/api/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"save",brand:currentBrand,...values})});brands=data.brands;card.dataset.id=data.template.id;button.textContent="저장 완료 ✓";setTimeout(()=>button.textContent="수정 저장",1300);toast("문구를 저장했습니다.")}catch(error){toast(error.message)}finally{button.disabled=false}}
  async function deleteCard(card){if(!confirm(`‘${card.querySelector(".title-input").value}’ 유형을 삭제할까요?`))return;try{const data=await request("/api/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"delete",brand:currentBrand,id:card.dataset.id})});brands=data.brands;renderList();toast("리뷰 유형을 삭제했습니다.")}catch(error){toast(error.message)}}
  function createCard(item,index){const card=document.createElement("article");card.className="template-card";card.dataset.id=item.id||"";card._keywords=[...(item.keywords||[])];card.innerHTML=`<div class="template-main"><div class="template-head"><div class="title-wrap"><span class="template-number">${index+1}</span><input class="title-input" maxlength="100" value="${esc(item.title||"")}" aria-label="리뷰 유형명"></div></div><div class="chips">${(item.keywords||[]).map(keyword=>`<span class="chip">${esc(keyword)}</span>`).join("")}</div><textarea class="message" maxlength="3000" aria-label="응대 문구" title="답변 원문 전체가 들어 있습니다. 이 박스 안에서 스크롤하세요.">${esc(item.message||"")}</textarea><small class="scroll-note">원문 전체 ${String(item.message||"").length}자 · 박스 안에서 스크롤</small></div><div class="card-actions"><button class="copy-button" type="button">문구 전체 복사</button><button class="save-button" type="button">수정 저장</button><button class="delete-button" type="button">삭제</button></div>`;
    const message=card.querySelector(".message");card.querySelector(".copy-button").addEventListener("click",event=>copyText(message.value.trim(),event.currentTarget));card.querySelector(".save-button").addEventListener("click",()=>saveCard(card));card.querySelector(".delete-button").addEventListener("click",()=>deleteCard(card));message.addEventListener("keydown",event=>{if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){event.preventDefault();copyText(message.value.trim(),card.querySelector(".copy-button"))}else if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="s"){event.preventDefault();saveCard(card)}});return card
  }
  function renderList(){const list=$("templateList"),rows=filtered();list.replaceChildren();$("templateCount").textContent=`${items().length}개`;$("brandTitle").textContent=`${currentBrand==="alp"?"ALP":"GAEA"} 응대 문구`;if(!rows.length){list.innerHTML='<div class="empty">검색 조건에 맞는 문구가 없습니다.</div>';return}rows.forEach((item,index)=>list.append(createCard(item,index)))}
  function switchBrand(brand){currentBrand=brand;$("search").value="";document.querySelectorAll(".brand-tab").forEach(button=>button.classList.toggle("active",button.dataset.brand===brand));renderList();scrollTo({top:0,behavior:"smooth"})}
  async function newTemplate(){const item={id:"",title:"새 리뷰 유형",keywords:[],message:"안녕하세요 고객님 :)\n\n소중한 리뷰를 남겨주셔서 감사합니다."};brands[currentBrand].push(item);renderList();const card=$("templateList").lastElementChild;card.scrollIntoView({behavior:"smooth",block:"center"});card.querySelector(".title-input").select()}
  async function resetBrand(){const label=currentBrand==="alp"?"ALP":"GAEA";if(!confirm(`${label} 문구를 기본 목록으로 복원할까요?`))return;try{const data=await request("/api/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"reset",brand:currentBrand})});brands=data.brands;renderList();toast(`${label} 기본 문구를 복원했습니다.`)}catch(error){toast(error.message)}}
  document.querySelectorAll(".brand-tab").forEach(button=>button.addEventListener("click",()=>switchBrand(button.dataset.brand)));$("search").addEventListener("input",renderList);$("newTemplate").addEventListener("click",newTemplate);$("resetBrand").addEventListener("click",resetBrand);
  (async()=>{try{const data=await request("/api/reviews");brands=data.brands||brands;renderList()}catch(error){toast(error.message)}})();
</script>
</body>
</html>
